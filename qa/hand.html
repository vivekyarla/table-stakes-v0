<!doctype html>
<html><head><meta charset="utf-8"><title>hand QA</title>
<style>html,body{margin:0;background:#22201d}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>window.onerror=(m,src,l,c)=>{document.body.insertAdjacentHTML('beforeend',
  '<pre style="color:#ff8f6b;background:#22201d;padding:12px;font:13px ui-monospace;white-space:pre-wrap">'+m+'\n'+src+':'+l+':'+c+'</pre>');document.title='error';};
window.addEventListener('unhandledrejection',e=>window.onerror(String(e.reason&&e.reason.stack||e.reason),'',0,0));</script>
<script type="module">
import { Ink } from '../js/ink.js';
import { Rng } from '../js/rng.js';
import { drawHand } from '../js/hands.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w')||900), H = +(q.get('h')||520), dpr = 2;
const grip = +(q.get('grip')||0.05);
const only = (q.get('only')||'all');
const c = document.getElementById('c'); c.width=W*dpr; c.height=H*dpr; c.style.width=W+'px';
const rng = new Rng(+(q.get('s')||7));
const ink = new Ink(W,H,{dpr,rng,paper:'#F2EFE7',inks:{ink:{color:'#1A1714',reg:[0,0]}}});
try {
  drawHand(ink.get('ink'), {x:W*0.30,y:H*0.46,a:0.18,s:0.95,grip,bend:1}, {only});
  ink.composite(c.getContext('2d'));
  document.title='ready';
} catch (e) {
  document.body.insertAdjacentHTML('beforeend',
    '<pre style="color:#ff8f6b;padding:14px;font:13px ui-monospace;white-space:pre-wrap">'+(e.stack||e.message)+'</pre>');
  document.title='error';
}
</script></body></html>
