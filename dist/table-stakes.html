<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --paper: #F2EFE7; --paper-2: #E9E4D8; --ink: #1C1815; --ink-2: #5A534B; --ink-3: #9A9288;
  --gold: #B98F32; --gold-2: #D6B15A; --black: #0E0C0A;
  --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --sans: Inter, system-ui, -apple-system, "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }

/* masthead: sits over the top of the map, in a band the drawing keeps clear */
#masthead { position: absolute; left: 0; right: 0; top: 0; z-index: 4; text-align: center; padding: 44px 24px 0; pointer-events: none; opacity: 0; transform: translateY(10px); transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1); }
#masthead.on { opacity: 1; transform: none; }
#masthead.now { transition: none; }
#masthead h1 { margin: 0; font: 700 clamp(36px, 5.2vw, 70px)/0.95 var(--serif); letter-spacing: -0.015em; color: var(--ink); }
#masthead h1 .tt { position: relative; display: inline-block; }
#masthead h1 .tt::after { content: ""; position: absolute; left: 2%; right: 2%; bottom: -0.07em; height: 0.055em; background: var(--gold); }
#masthead .by { margin: 16px 0 0; display: inline-flex; align-items: center; gap: 12px; font: italic 400 clamp(17px, 1.8vw, 22px)/1 var(--serif); color: var(--ink-2); }
#masthead .by .word { height: 1.05em; width: auto; color: var(--ink); position: relative; top: 1px; }
#masthead .by .mark { height: 1.55em; width: auto; color: var(--gold); margin-left: -4px; position: relative; top: 1px; }

/* hero / map */
#hero { position: relative; width: 100%; height: clamp(560px, 88vh, 860px); overflow: hidden; background: var(--paper); }
#leaflet { position: absolute; inset: 0; z-index: 2; background: transparent; }
#leaflet.tiles { background: var(--paper); }
#leaflet .leaflet-tile-pane { filter: grayscale(1) contrast(1.05) brightness(1.04); mix-blend-mode: multiply; opacity: .55; }
#map { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.leaflet-marker-pane { z-index: 620; opacity: 0; transition: opacity .8s ease .2s; pointer-events: none; }
#hero.ready .leaflet-marker-pane { opacity: 1; pointer-events: auto; }
#hero.now .leaflet-marker-pane { transition: none; }
.marker-wrap { background: none; border: 0; }
.marker { position: absolute; left: 15px; top: 15px; transform: translate(-50%, -50%); background: none; border: 0; padding: 0; cursor: pointer; display: grid; justify-items: center; gap: 4px; font: inherit; color: var(--ink); }
.marker .pin { position: relative; width: 30px; height: 30px; color: var(--gold); filter: drop-shadow(0 1px 1px rgba(28,24,21,.35)); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.marker .pin::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--paper); box-shadow: 0 0 0 1px rgba(28,24,21,.25); z-index: -1; }
.marker .pin svg { width: 100%; height: 100%; display: block; overflow: visible; stroke: currentColor; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
.marker:hover .pin, .marker:focus-visible .pin { transform: scale(1.35) rotate(15deg); }
.marker .name { white-space: nowrap; font: italic 500 13px/1 var(--serif); letter-spacing: .01em; background: var(--paper); padding: 2px 6px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(28,24,21,.12); opacity: 0; transform: translateY(-4px); transition: opacity .2s ease, transform .2s ease; }
.marker:hover .name, .marker:focus-visible .name { opacity: 1; transform: none; }
.marker:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 4px; }
.pulse { position: absolute; width: 22px; height: 22px; left: 0; top: 0; }

#card { position: absolute; left: 0; top: 0; z-index: 5; width: 250px; padding: 14px 16px 12px; background: var(--paper); color: var(--ink); border: 1px solid rgba(28,24,21,.2); box-shadow: 0 12px 30px rgba(28,24,21,.14), 0 1px 0 rgba(255,255,255,.7) inset; opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 20; font-size: 13px; line-height: 1.45; }
#card.on { opacity: 1; }
#card b { font: 700 18px/1.1 var(--serif); display: block; }
#card .nb { display: block; color: var(--ink-2); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin: 6px 0 8px; }
#card p { margin: 8px 0 6px; }
#card em { font-style: normal; font-size: 11px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }


/* intro */
#intro-wrap { position: fixed; inset: 0; z-index: 40; background: var(--paper); transition: opacity .9s ease; cursor: pointer; }
#intro-wrap.gone { opacity: 0; pointer-events: none; }
#intro-wrap::after { content: "click to skip"; position: absolute; right: 22px; bottom: 18px; font: 500 11px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
#intro { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: auto; }
#intro-wrap { background: transparent; }
#intro-wrap .veil { position: absolute; inset: 0; background: var(--paper); transition: opacity 1.4s ease; }
#intro-wrap.reveal .veil { opacity: 0; }

/* the guide */
.guide { max-width: 1120px; margin: 0 auto; padding: 72px 24px 120px; }
.guide .intro { display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px 48px; align-items: end; border-top: 1px solid var(--ink); padding-top: 22px; margin-bottom: 44px; }
.guide .intro h2 { margin: 0; max-width: 22ch; font: 500 clamp(26px, 3vw, 38px)/1.15 var(--serif); text-wrap: balance; }
.guide .intro p { margin: 0 0 6px; max-width: 30ch; font: 500 clamp(17px, 1.5vw, 20px)/1.4 var(--serif); font-style: italic; color: var(--ink-2); }
.legend { display: flex; gap: 26px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-bottom: 40px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.shakes { display: inline-flex; gap: 3px; }
.shakes i { width: 20px; height: 20px; display: inline-block; color: var(--paper-2); }
.shakes i svg { width: 100%; height: 100%; display: block; stroke: var(--ink-3); }
.shakes i.on { color: var(--gold); }
.shakes i.on svg { stroke: var(--ink); }

.spot { display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(300px, 34%); gap: 20px 32px; padding: 44px 0; border-top: 1px solid rgba(28,24,21,.18); align-items: start; }
.spot .num { font: 500 13px/1.2 var(--sans); letter-spacing: .14em; color: var(--ink-3); padding-top: 14px; }
.spot header h2 { margin: 0 0 8px; font: 700 clamp(30px, 3.6vw, 48px)/1 var(--serif); }
.spot .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 14px; margin-bottom: 4px; }
.spot .meta span + span::before { content: "·"; margin-right: 14px; color: var(--ink-3); }
.spot .meta a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--gold); }
.spot .meta a:hover { text-decoration-color: var(--ink); }
.spot .hours { color: var(--ink-3); font-size: 13px; margin-bottom: 14px; }
.spot .rating { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.spot .rating .shakes i { width: 24px; height: 24px; }
.spot .verdict { font: italic 400 15px/1 var(--serif); color: var(--ink-2); }
.spot .notes { font-size: 17px; line-height: 1.5; margin: 0 0 18px; max-width: 52ch; }
.spot .notes b { font: 500 11px/1.6 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 4px; }
.spot .tip { border: 1px solid rgba(28,24,21,.22); border-left: 3px solid var(--gold); padding: 12px 16px; max-width: 52ch; background: rgba(255,255,255,.35); }
.spot .tip b { font: 500 11px/1.6 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 2px; }
.spot .tip p { margin: 0; font-size: 15px; line-height: 1.45; }
.spot .photo { aspect-ratio: 4 / 3; width: 100%; max-width: 100%; border: 1px solid rgba(28,24,21,.25); box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 12px 30px rgba(28,24,21,.10); overflow: hidden; position: relative; background: var(--paper-2); margin-top: 6px; }
.spot .photo img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(.15) contrast(1.02); }
.spot .photo.empty { background: repeating-linear-gradient(-45deg, rgba(28,24,21,.05) 0 1px, transparent 1px 7px), var(--paper-2); display: grid; place-items: center; }
.spot .photo.empty span { font: italic 400 15px/1 var(--serif); color: var(--ink-3); background: var(--paper); padding: 6px 12px; border: 1px solid rgba(28,24,21,.15); }
.spot .photo.empty svg { position: absolute; right: 12px; top: 12px; width: 18px; height: 18px; color: var(--gold); }

footer { border-top: 1px solid var(--ink); margin-top: 60px; padding: 28px 0 0; display: flex; justify-content: space-between; align-items: center; color: var(--ink-2); font-size: 13px; }
footer .lockup { height: 40px; color: var(--ink); }
footer .lockup svg { height: 100%; width: auto; }

@media (max-width: 720px) {
  .guide .intro { grid-template-columns: 1fr; }
  .spot { grid-template-columns: 1fr; gap: 12px; }
  .spot .num { padding-top: 0; }
  .spot .photo { order: -1; }
  #card { width: 210px; }
}

</style>
<script>
  // ?debug: surface exceptions on the page so a headless screenshot is never silently blank
  if (location.search.includes('debug')) {
    const log = (m) => { let e = document.getElementById('err'); if (!e) { e = document.createElement('pre'); e.id = 'err'; e.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99;background:#22201d;color:#ff8f6b;font:12px ui-monospace;padding:8px;white-space:pre-wrap;max-width:100vw'; document.body.appendChild(e); } e.textContent += m + '\n'; };
    addEventListener('error', (e) => log(e.message + ' @ ' + e.filename + ':' + e.lineno));
    addEventListener('unhandledrejection', (e) => log('rejection: ' + (e.reason && e.reason.stack || e.reason)));
  }
